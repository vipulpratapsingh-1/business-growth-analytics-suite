<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Business Growth Analytics Suite - Enterprise Web App</title>
  <link rel="stylesheet" href="index.css">
  <!-- Chart.js for live interactive visualizations -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <!-- Top Navbar -->
  <header class="navbar">
    <div class="nav-brand">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M3 3v18h18"/>
        <path d="m19 9-5 5-4-4-3 3"/>
      </svg>
      <div>Business Growth <span>Analytics Suite</span></div>
    </div>
    <div style="display: flex; align-items: center; gap: 16px;">
      <select id="role-switcher" onchange="changeActiveRole(this.value)" style="background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 6px 12px; border-radius: 6px; cursor: pointer;">
        <option value="Admin" style="color: black;">Role: Admin (Full Access)</option>
        <option value="Manager" style="color: black;">Role: Manager (Upload & Analytics)</option>
        <option value="Analyst" style="color: black;">Role: Analyst (Read & SQL)</option>
      </select>
      <span id="user-role-badge" class="role-badge role-admin">Admin</span>
      <div id="user-name-display" style="font-size: 0.9rem; font-weight: 600;">Executive Admin</div>
      <button class="btn-primary" onclick="showLoginModal()" style="padding: 6px 14px; font-size: 0.82rem;">Sign In / Token</button>
    </div>
  </header>

  <!-- Main App Layout -->
  <div class="app-container">
    
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <button class="sidebar-btn active" onclick="switchTab('executive')">
        <span>📊</span> Executive Overview
      </button>
      <button class="sidebar-btn" onclick="switchTab('sales')">
        <span>📈</span> Sales Analytics
      </button>
      <button class="sidebar-btn" onclick="switchTab('customer')">
        <span>👥</span> Customer Analytics
      </button>
      <button class="sidebar-btn" onclick="switchTab('product')">
        <span>📦</span> Product Analytics
      </button>
      <button class="sidebar-btn" onclick="switchTab('ml')">
        <span>🤖</span> ML Forecast & Predictions
      </button>
      <button class="sidebar-btn" onclick="switchTab('dataset')">
        <span>📁</span> Dataset Manager
      </button>
      <button class="sidebar-btn" onclick="switchTab('sql')">
        <span>⚡</span> SQL Query Console
      </button>
      <button class="sidebar-btn" onclick="switchTab('reports')">
        <span>📑</span> Power BI & Reports
      </button>

      <div style="margin-top: auto; padding: 16px; background: #f8fafc; border-radius: 8px; font-size: 0.75rem; color: #64748b;">
        <div style="font-weight: 700; color: #0f172a; margin-bottom: 4px;">SYSTEM STATUS</div>
        <div>FastAPI Server: <span style="color: #10b981; font-weight: 700;">● Online</span></div>
        <div>Swagger Docs: <a href="/docs" target="_blank" style="color: #0ea5e9;">/docs</a></div>
      </div>
    </aside>

    <!-- Main Dynamic Content -->
    <main class="main-content" id="app-viewport">
      <div class="spinner"></div>
    </main>

  </div>

  <!-- Auth Modal -->
  <div id="auth-modal" style="display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.6); backdrop-filter: blur(6px); z-index: 2000; align-items: center; justify-content: center;">
    <div class="glass-card" style="background: white; padding: 32px; width: 380px; max-width: 90%;">
      <h3 style="font-size: 1.3rem; margin-bottom: 8px; color: #0f172a;">Enterprise JWT Auth</h3>
      <p style="color: #64748b; font-size: 0.85rem; margin-bottom: 20px;">Sign in to access Role-Based endpoints.</p>
      
      <div style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px;">
        <input type="email" id="auth-email" value="admin@growthsuite.com" style="padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;" placeholder="Email address">
        <input type="password" id="auth-password" value="admin123" style="padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;" placeholder="Password">
      </div>

      <div style="display: flex; gap: 10px;">
        <button class="btn-primary" style="flex: 1;" onclick="submitLogin()">Login</button>
        <button style="padding: 10px 16px; border: 1px solid #cbd5e1; border-radius: 6px; background: transparent; cursor: pointer;" onclick="hideLoginModal()">Close</button>
      </div>
    </div>
  </div>

  <!-- Single Page App Client Script -->
  <script src="app.js"></script>
</body>
</html>
