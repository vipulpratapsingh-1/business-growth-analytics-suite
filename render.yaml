services:
  - type: web
    name: business-growth-analytics-api
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET_KEY
        value: enterprise_growth_analytics_secret_key_2026
      - key: CORS_ORIGINS
        value: "*"
      - key: PYTHONPATH
        value: "."
